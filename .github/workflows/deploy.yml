name: Test & Deploy

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun run install:all

      - name: Run tests
        run: bun run test

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build image and deploy to Dokploy
        uses: fongfan999/github-actions/dokploy-deploy@main
        with:
          deploy_hook_url: ${{ secrets.DOKPLOY_DEPLOY_HOOK_URL }}
